<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rama Japah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TailwindCSS CDN -->
    <script src="https://apis.google.com/js/api.js"></script>
    <!-- YouTube API -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        customOrange: '#FF8C00', // Top bar color
                        lightOrange: '#FFA500', // New color for the rest of the page
                    },
                },
            },
        };

        // Dynamically adjust video iframe source to ensure compatibility
        function openVideo(videoId) {
            const iframe = document.getElementById("video-player");
            const videoWrapper = document.getElementById("video-player-wrapper");
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&rel=0`;
            videoWrapper.classList.remove("hidden");
        }

        function closeVideo() {
            const iframe = document.getElementById("video-player");
            const videoWrapper = document.getElementById("video-player-wrapper");
            iframe.src = ""; // Clear video source to stop playback
            videoWrapper.classList.add("hidden");
        }
    </script>
</head>

<body class="bg-lightOrange font-sans overflow-x-hidden">

    <!-- Header Section -->
    <header class="bg-customOrange p-4 sm:p-5 flex justify-between items-center text-white w-full">
        <div class="logo">
            <img src="https://seeklogo.com/images/H/hanuman-logo-084AAB8185-seeklogo.com.png" alt="Rama Japah Logo" class="h-16 sm:h-20">
        </div>
        <div class="search-bar flex items-center space-x-2 w-full sm:w-auto">
            <!-- Search Input -->
            <input type="text" id="search-input" class="p-2 rounded border-none w-full sm:w-64 text-black" placeholder="Search...">

            <!-- Search Button (only visible on larger screens) -->
            <button onclick="searchVideos()" class="p-2 bg-orange-700 text-white rounded hover:bg-orange-800 w-auto sm:w-auto hidden sm:block">
                Search
            </button>

            <!-- Search Icon (only visible on smaller screens) -->
            <button onclick="searchVideos()" class="p-2 bg-orange-700 text-white rounded hover:bg-orange-800 w-10 h-10 sm:w-auto sm:h-auto block sm:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm0 0l6 6" />
                </svg>
            </button>
        </div>
        <div class="header-right">
            <img src="image.png" alt="User Icon" class="h-14 sm:h-16 ml-2">
        </div>
    </header>

    <!-- Main Content Section -->
    <div class="main-content p-4 sm:p-6 max-w-screen-xl mx-auto">
        <!-- Video Player Section -->
        <div class="video-player-wrapper mx-auto inline-block relative hidden mb-6" id="video-player-wrapper">
            <button id="close-button" onclick="closeVideo()" class="absolute top-2 right-2 bg-opacity-60 bg-black text-white text-xl rounded-full w-7 h-7 flex items-center justify-center hover:bg-opacity-80">
                ×
            </button>
            <iframe id="video-player" class="w-full h-[200px] sm:h-[450px] md:h-[600px]" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
            </iframe>
        </div>

        <!-- Video List Section (Suggested & Searched Videos) -->
        <div class="video-list-wrapper grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 bg-lightOrange" id="video-list-wrapper">
            <!-- Video Thumbnails will be dynamically added here -->
        </div>

        <!-- Show More Button -->
        <button id="show-more-button" onclick="loadMoreVideos()" class="hidden bg-orange-600 text-white py-2 px-4 rounded mt-5 w-full hover:bg-orange-700">
            Show More
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
